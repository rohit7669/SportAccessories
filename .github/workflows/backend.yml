name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'backend.Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -f backend.Dockerfile \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/sport-backend:latest .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sport-backend:latest
