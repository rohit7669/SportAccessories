name: Frontend CI

on:
  push:
    paths:
      - 'client/**'
      - 'docker/frontend/**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - name: DockerHub Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Image
      run: |
        docker build \
        -f docker/frontend/Dockerfile \
        -t rohit7669/sport-frontend:latest .

    - name: Push Image
      run: |
        docker push rohit7669/sport-frontend:latest