apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sport-app

spec:

  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: rohit7669/sport-frontend:latest

        ports:
        - containerPort: 80